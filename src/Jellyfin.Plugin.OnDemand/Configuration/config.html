<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>On-Demand Streaming</title></head>
<body>
<div id="OnDemandConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
  <div data-role="content"><div class="content-primary">
    <form id="OnDemandForm">
      <div class="inputContainer"><label>Seerr URL<input is="emby-input" id="SeerrUrl" type="text" /></label></div>
      <div class="inputContainer"><label>Seerr API key<input is="emby-input" id="SeerrApiKey" type="password" /></label></div>
      <div class="inputContainer"><label>qBittorrent URL<input is="emby-input" id="QbitUrl" type="text" /></label></div>
      <div class="inputContainer"><label>qBittorrent user<input is="emby-input" id="QbitUsername" type="text" /></label></div>
      <div class="inputContainer"><label>qBittorrent password<input is="emby-input" id="QbitPassword" type="password" /></label></div>
      <div class="inputContainer"><label>Radarr URL<input is="emby-input" id="RadarrUrl" type="text" /></label></div>
      <div class="inputContainer"><label>Radarr API key<input is="emby-input" id="RadarrApiKey" type="password" /></label></div>
      <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
    </form>
  </div></div>
  <script type="text/javascript">
    var id = '7d2f6c1e-3b8a-4c55-9a1e-0d6f4b2a9e31';
    var fields = ['SeerrUrl','SeerrApiKey','QbitUrl','QbitUsername','QbitPassword','RadarrUrl','RadarrApiKey'];
    document.querySelector('#OnDemandConfigPage').addEventListener('pageshow', function () {
      ApiClient.getPluginConfiguration(id).then(function (c) {
        fields.forEach(function (f) { document.getElementById(f).value = c[f] || ''; });
      });
    });
    document.getElementById('OnDemandForm').addEventListener('submit', function (e) {
      e.preventDefault();
      ApiClient.getPluginConfiguration(id).then(function (c) {
        fields.forEach(function (f) { c[f] = document.getElementById(f).value; });
        ApiClient.updatePluginConfiguration(id, c).then(Dashboard.processPluginConfigurationUpdateResult);
      });
    });
  </script>
</div></body></html>
